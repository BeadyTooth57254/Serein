<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Serein 自动召回流程</title>
  <desc id="desc">从原句、预检、批量状态过滤、多路线候选、混合候选池、正文重排到网关或 Hook 实际交付的流程图。</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#60706b"/></marker>
    <style>text{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#24332f}.title{font-size:28px;font-weight:700}.sub{font-size:15px;fill:#65736f}.h{font-size:17px;font-weight:700}.p{font-size:14px;fill:#4d5e59}.box{fill:#fbfcfa;stroke:#aab8b3;stroke-width:1.5}.gate{fill:#f4f8f4;stroke:#749087}.signal{fill:#f8f4ec;stroke:#b69e72}.final{fill:#eef5f2;stroke:#5f8277}.bus,.line{stroke:#60706b;stroke-width:1.7;fill:none}.line{marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="720" rx="28" fill="#f2f4f1"/>
  <text x="60" y="58" class="title">Serein 自动召回</text>
  <text x="60" y="86" class="sub">候选信号只负责提名；正文 reranker 决定是否命中；交付记录证明实际送入。</text>
  <rect x="60" y="125" width="170" height="90" rx="16" class="box"/><text x="145" y="160" text-anchor="middle" class="h">原句</text><text x="145" y="187" text-anchor="middle" class="p">一次 query embedding</text>
  <path d="M230 170H285" class="line"/>
  <rect x="285" y="125" width="190" height="90" rx="16" class="gate"/><text x="380" y="157" text-anchor="middle" class="h">语义路由预检</text><text x="380" y="183" text-anchor="middle" class="p">skip / recall 边界</text><text x="380" y="204" text-anchor="middle" class="p">可在候选前结束</text>
  <path d="M475 170H530" class="line"/>
  <rect x="530" y="112" width="290" height="116" rx="16" class="gate"/><text x="675" y="142" text-anchor="middle" class="h">批量资格过滤</text><text x="675" y="168" text-anchor="middle" class="p">active · 可浮现 · 当前 revision</text><text x="675" y="191" text-anchor="middle" class="p">排除替换 Event / Scene 完整覆盖 Event</text><text x="675" y="214" text-anchor="middle" class="p">主域限制 · exclude_ids</text>
  <path d="M820 170H875" class="line"/>
  <rect x="875" y="125" width="265" height="90" rx="16" class="box"/><text x="1008" y="157" text-anchor="middle" class="h">可检索 Event + Scene</text><text x="1008" y="184" text-anchor="middle" class="p">不合格对象不参与解码与打分</text>
  <path d="M1008 215V270H182V305" class="line"/>
  <rect x="60" y="305" width="245" height="100" rx="16" class="signal"/><text x="182" y="337" text-anchor="middle" class="h">正文 / passage 向量</text><text x="182" y="365" text-anchor="middle" class="p">相似度与 freshness 排序</text><text x="182" y="387" text-anchor="middle" class="p">扩展默认 ≥ 0.50</text>
  <rect x="335" y="305" width="245" height="100" rx="16" class="signal"/><text x="458" y="337" text-anchor="middle" class="h">Scene cue 语义</text><text x="458" y="365" text-anchor="middle" class="p">不是逐字关键词</text><text x="458" y="387" text-anchor="middle" class="p">扩展默认 ≥ 0.55</text>
  <rect x="610" y="305" width="245" height="100" rx="16" class="signal"/><text x="732" y="337" text-anchor="middle" class="h">Event 特定关键词</text><text x="732" y="365" text-anchor="middle" class="p">提供候选入口</text><text x="732" y="387" text-anchor="middle" class="p">泛词不撑开池</text>
  <rect x="885" y="305" width="255" height="100" rx="16" class="signal"/><text x="1012" y="337" text-anchor="middle" class="h">完整实体名</text><text x="1012" y="365" text-anchor="middle" class="p">需要回忆意图 / 明确结构</text><text x="1012" y="387" text-anchor="middle" class="p">只提名，不直接命中</text>
  <path d="M182 405V435M458 405V435M732 405V435M1012 405V435M182 435H1012" class="bus"/><path d="M600 435V458" class="line"/>
  <rect x="435" y="458" width="330" height="105" rx="18" class="box"/><text x="600" y="489" text-anchor="middle" class="h">混合候选池</text><text x="600" y="516" text-anchor="middle" class="p">前 6 条宽探针</text><text x="600" y="539" text-anchor="middle" class="p">第 7–20 条须满足至少一种扩展证据</text>
  <rect x="60" y="472" width="270" height="78" rx="16" class="box"/><text x="195" y="501" text-anchor="middle" class="h">已确认 Scene 关系</text><text x="195" y="528" text-anchor="middle" class="p">最多扩展 1 个邻接候选，不加分</text><path d="M330 511H435" class="line"/>
  <path d="M765 511H830" class="line"/>
  <rect x="830" y="458" width="310" height="105" rx="18" class="final"/><text x="985" y="489" text-anchor="middle" class="h">正文 reranker</text><text x="985" y="516" text-anchor="middle" class="p">完整原句 × 候选正文</text><text x="985" y="539" text-anchor="middle" class="p">达到“最终命中门槛”才通过</text>
  <path d="M985 563V620H840" class="line"/>
  <rect x="545" y="604" width="295" height="76" rx="16" class="final"/><text x="692" y="633" text-anchor="middle" class="h">选卡与会话冷却</text><text x="692" y="659" text-anchor="middle" class="p">默认最多 2 张；胜出后冷却，不补位</text>
  <path d="M545 642H475" class="line"/>
  <rect x="60" y="604" width="415" height="76" rx="16" class="final"/><text x="268" y="633" text-anchor="middle" class="h">实际交付边界</text><text x="268" y="659" text-anchor="middle" class="p">Gateway 直接加入 · Hook 由宿主注入并登记</text>
</svg>
