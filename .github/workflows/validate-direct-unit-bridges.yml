name: Validate direct-unit Track bridges

on:
  push:
    branches: [fix/direct-unit-track-bridges]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -e '.[test,http,embedding,background,mcp]'
      - name: Run backend test suite
        run: python -m pytest -q
