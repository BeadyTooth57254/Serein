name: Validate recall observation refresh

on:
  push:
    branches: [fix/recall-observation-live]
    paths: ['.github/workflows/validate-observation-live.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/recall-observation-live
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply reviewed patch bundle to this branch
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, json, os, urllib.request
          if Path('web/src/storage/recallObservationFeed.js').exists():
              print('Source changes are already committed; validating the current branch.')
              raise SystemExit(0)
          # These immutable blobs contain the patch authored in this conversation,
          # split solely for connector transport. Final changes are ordinary source files.
          shas = ['17f50f6c717b926a03c9c067a6fd5469b88d8822',
                  '866859762a65f2563092f261bad16b60332e77f3',
                  '2b0a65476ba54d8da7a0711f7d98a7a0152ad2ca',
                  'a3fb1a5b20f268673c81873c5da6b227d91d7e14']
          parts = []
          for sha in shas:
              request = urllib.request.Request(f'https://api.github.com/repos/Yinglianchun/Serein/git/blobs/{sha}',
                  headers={'Authorization': 'Bearer '+os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  blob=json.load(response)
              assert blob['sha']==sha
              parts.append(base64.b64decode(blob['content']))
          bundle=json.loads(gzip.decompress(base64.b64decode(b''.join(parts))))
          for name,content in bundle.items():
              if name=='apply.py': continue
              path=Path(name)
              assert not path.is_absolute() and '..' not in path.parts
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_text(content)
          exec(compile(bundle['apply.py'], 'observation_patch.py', 'exec'))
          PY
          git diff --check
          git add src web tests docs/interactive-install.md release-files.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: retain recall observations and refresh paginated lists'
            git push origin HEAD:fix/recall-observation-live
          fi
          git rev-parse HEAD
      - name: Install backend test dependencies
        run: python -m pip install -e '.[test,http,embedding,background,mcp]'
      - name: Run full backend suite
        id: backend
        continue-on-error: true
        run: python -m pytest -q
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      - name: Run frontend tests and production build
        id: frontend
        continue-on-error: true
        working-directory: web
        run: |
          node --test tests/*.test.mjs
          npm run build
      - name: Install isolated browser test runtime
        working-directory: web
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Exercise real observation component with synthetic HTTP fixtures
        id: browser
        continue-on-error: true
        working-directory: web
        run: node tests/recall-observation.browser.mjs
      - name: Verify all validation stages
        if: always()
        run: |
          echo 'Backend: ${{ steps.backend.outcome }}'
          echo 'Frontend: ${{ steps.frontend.outcome }}'
          echo 'Browser: ${{ steps.browser.outcome }}'
          test '${{ steps.backend.outcome }}' = success
          test '${{ steps.frontend.outcome }}' = success
          test '${{ steps.browser.outcome }}' = success
