name: Validate Python 3.11 reranker document

on:
  push:
    branches: [fix/python311-reranker-document]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -e '.[test,http,embedding,background,mcp]'
      - name: Compile candidate module
        run: python -m py_compile src/serein/recall/germany/candidates.py
      - name: Run focused recall candidate tests
        run: python -m pytest -q tests/test_recall_candidate_budget.py
